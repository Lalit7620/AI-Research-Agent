{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | ResearchAI</title>

    <script src="https://cdn.tailwindcss.com"></script>

</head>


<body class="bg-slate-950 text-white min-h-screen
             flex items-center justify-center">

    <div class="w-full max-w-md p-8">

        <h1 class="text-3xl font-semibold mb-2">
            Welcome back
        </h1>

        <p class="text-slate-400 mb-8">
            Sign in to continue your research.
        </p>


        {% if error %}

            <div class="bg-red-500/10 border border-red-500/30
                        text-red-400 p-3 rounded-lg mb-5">

                {{ error }}

            </div>

        {% endif %}


        <form method="POST">

            {% csrf_token %}


            <div class="mb-5">

                <label class="block text-sm mb-2">
                    Username
                </label>

                <input
                    type="text"
                    name="username"
                    required
                    class="w-full bg-slate-900 border
                           border-slate-700 rounded-lg
                           px-4 py-3 outline-none"
                >

            </div>


            <div class="mb-6">

                <label class="block text-sm mb-2">
                    Password
                </label>

                <input
                    type="password"
                    name="password"
                    required
                    class="w-full bg-slate-900 border
                           border-slate-700 rounded-lg
                           px-4 py-3 outline-none"
                >

            </div>


            <button
                type="submit"
                class="w-full bg-indigo-600 hover:bg-indigo-500
                       py-3 rounded-lg font-medium">

                Login

            </button>

        </form>


        <p class="text-slate-400 text-sm mt-6 text-center">

            Don't have an account?

            <a
                href="{% url 'register' %}"
                class="text-indigo-400">

                Create one

            </a>

        </p>

    </div>

</body>

</html>
